name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Package binary
        run: |
          cd .build/release
          zip -j mdx2dict-macos.zip mdx2dict

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: .build/release/mdx2dict-macos.zip
          generate_release_notes: true
